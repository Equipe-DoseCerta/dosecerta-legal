<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DoseCerta - Documentação Legal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0A7AB8 0%, #023047 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 50px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
        }
        h1 {
            color: #0A7AB8;
            font-size: 2.5em;
            margin-bottom: 20px;
        }
        .subtitle {
            color: #666;
            font-size: 1.2em;
            margin-bottom: 40px;
        }
        .links {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .link-card {
            background: linear-gradient(135deg, #0A7AB8 0%, #054F77 100%);
            color: white;
            padding: 25px;
            border-radius: 12px;
            text-decoration: none;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .link-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(10, 122, 184, 0.4);
        }
        .icon {
            font-size: 2.5em;
        }
        .link-text {
            text-align: left;
        }
        .link-title {
            font-size: 1.3em;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .link-description {
            font-size: 0.9em;
            opacity: 0.9;
        }
        .footer {
            margin-top: 40px;
            color: #666;
            font-size: 0.9em;
        }
        @media (max-width: 768px) {
            .container {
                padding: 30px;
            }
            h1 {
                font-size: 2em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>💊 DoseCerta</h1>
        <p class="subtitle">Documentação Legal do Aplicativo</p>
        
        <div class="links">
            <a href="politica-privacidade.html" class="link-card">
                <span class="icon">🔒</span>
                <div class="link-text">
                    <div class="link-title">Política de Privacidade</div>
                    <div class="link-description">LGPD - Lei nº 13.709/2018</div>
                </div>
            </a>
            
            <a href="termos-de-uso.html" class="link-card">
                <span class="icon">📜</span>
                <div class="link-text">
                    <div class="link-title">Termos de Uso</div>
                    <div class="link-description">Condições de uso do aplicativo</div>
                </div>
            </a>
        </div>
        
        <div class="footer">
            <p><strong>DoseCerta</strong></p>
            <p>© 2025 - Todos os direitos reservados</p>
        </div>
    </div>
</body>
</html>
